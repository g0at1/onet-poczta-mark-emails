<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="card">
    <div class="folders-info">
      <div class="title">Available folders</div>
      <div>📥 Odebrane <span>→ 29999</span></div>
      <div>🚫 Spam <span>→ 30002</span></div>
    </div>

    <div class="field">
      <label for="folderId">Folder ID</label>
      <input id="folderId" value="29999">
    </div>

    <div class="field">
      <label for="folderName">Folder name</label>
      <select id="folderName">
        <option value="Odebrane" data-id="29999">Odebrane</option>
        <option value="Spam" data-id="30002">Spam</option>
      </select>
    </div>

    <div class="field">
      <label for="limit">Mail limit</label>
      <input id="limit" type="number" value="1000" min="1">
    </div>

    <button id="run">Mark 1000 as read</button>

    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
